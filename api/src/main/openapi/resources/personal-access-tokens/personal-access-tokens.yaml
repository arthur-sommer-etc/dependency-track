get:
  operationId: listPersonalAccessTokens
  summary: List the personal access tokens of the signed-in user
  description: |-
    Returns a paginated list of the personal access tokens the signed-in user owns, newest first.

    Requires a human user session. Personal access tokens and service accounts cannot manage tokens.
  security:
    - bearerAuth: []
  tags:
    - Personal Access Tokens
  parameters:
    - $ref: "../../shared/parameters/page-token.yaml"
    - $ref: "../../shared/parameters/pagination-limit.yaml"
  responses:
    "200":
      description: Paginated list of personal access tokens
      content:
        application/json:
          schema:
            $ref: "../service-accounts/schemas/list-service-account-api-keys-response.yaml"
    "400":
      description: Invalid request or page token
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: "../../shared/schemas/invalid-request-problem-details.yaml"
            - $ref: "../../shared/schemas/problem-details.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"

post:
  operationId: createPersonalAccessToken
  summary: Create a personal access token for the signed-in user
  description: |-
    Creates a new personal access token owned by the signed-in user.

    The plain text key is returned exactly once, in the response body.
    It cannot be retrieved afterwards, because only its hash is stored.

    No personal access tokens can be created for a suspended user.

    Requires a human user session. Names must contain at least one non-whitespace character.
  security:
    - bearerAuth: []
  tags:
    - Personal Access Tokens
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "./schemas/create-personal-access-token-request.yaml"
  responses:
    "201":
      description: Personal access token created
      headers:
        Location:
          description: URL of the created personal access token
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: "../service-accounts/schemas/create-service-account-api-key-response.yaml"
    "400":
      description: Bad Request
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: "../../shared/schemas/invalid-request-problem-details.yaml"
            - $ref: "../../shared/schemas/problem-details.yaml"
    "401":
      $ref: "../../shared/responses/generic-unauthorized-error.yaml"
    "403":
      $ref: "../../shared/responses/generic-forbidden-error.yaml"
    "404":
      $ref: "../../shared/responses/generic-not-found-error.yaml"
    "409":
      $ref: "../../shared/responses/generic-conflict-error.yaml"
    default:
      $ref: "../../shared/responses/generic-error.yaml"
